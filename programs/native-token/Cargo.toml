[package]
name = "powerchain-native-token"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "PTK-001 PowerChain native PWRC reference program"
license.workspace = true
publish.workspace = true

[lib]
name = "powerchain_native_token"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[features]
default = ["std"]
std = []
program = ["dep:pinocchio", "dep:pinocchio-log", "dep:pinocchio-token-2022"]
mainnet-beta = ["program"]
test-support = ["std"]

[dependencies]
pinocchio = { workspace = true, optional = true }
pinocchio-log = { workspace = true, optional = true }
pinocchio-token-2022 = { workspace = true, optional = true }

[dev-dependencies]
serde_json = { workspace = true }
proptest = { workspace = true }

[lints]
workspace = true
