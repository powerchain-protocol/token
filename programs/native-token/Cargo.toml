[package]
name = "powerchain-native-token"
version = "1.0.0-rc.0"
edition = "2021"
description = "PTK-001 PowerChain native PWRC reference program"
license = "Apache-2.0"
publish = false

[lib]
name = "powerchain_native_token"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[features]
default = ["std"]
std = []
program = ["dep:pinocchio", "dep:pinocchio-log", "dep:pinocchio-token-2022"]
mainnet-beta = ["program"]
test-support = ["std"]

[dependencies]
pinocchio = { version = "0.11.2", optional = true, default-features = false }
pinocchio-log = { version = "0.5", optional = true }
pinocchio-token-2022 = { version = "0.1", optional = true }

[dev-dependencies]
serde_json = "1"
proptest = "1"

[lints.rust]
unsafe_code = "forbid"

[profile.release]
codegen-units = 1
lto = "fat"
overflow-checks = true
panic = "abort"
strip = "symbols"
